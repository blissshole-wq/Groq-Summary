name: Anandan's Trading System

on:
  schedule:
    # 1. காலை 8:00 AM IST (UTC 2:30 AM) - News Summary
    - cron: '30 2 * * *'
    # 2. மதியம் 2:00 PM IST (UTC 8:30 AM) - Stock Scanner
    - cron: '30 8 * * *'
    # 3. மாலை 5:00 PM IST (UTC 11:30 AM) - News Summary
    - cron: '30 11 * * *'
  workflow_dispatch: # மேனுவலா டெஸ்ட் பண்ண

jobs:
  # வேலை 1: AI நியூஸ் சம்மரி
  news-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run Summary
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python summary.py

  # வேலை 2: ஸ்டாக் ஸ்கேனர்
  stock-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scanner.py
